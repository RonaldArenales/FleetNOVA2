databases:
  - name: fleetnova-ronald-db
    plan: free
    databaseName: fleetnova
    user: fleetnova

services:
  - type: web
    name: fleetnova-ronald-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run seed && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: fleetnova-ronald-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://fleetnova-ronald-app.onrender.com

  - type: web
    name: fleetnova-ronald-app
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: https://fleetnova-ronald-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
