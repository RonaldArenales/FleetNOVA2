services:
  - type: web
    name: fleetnova2-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run seed && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Cadenas de conexion de Neon (Dashboard de Neon -> Connection Details).
      # Se dejan sin valor aqui a proposito: Render pedira completarlas a
      # mano al importar este blueprint, para no subir credenciales al repo.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://fleetnova2-app.onrender.com,https://fleetnova2-conductor.onrender.com

  - type: web
    name: fleetnova2-app
    runtime: static
    rootDir: web
    buildCommand: npm install -g npm@latest && npm cache clean --force && rm -rf node_modules package-lock.json && npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: VITE_API_URL
        value: https://fleetnova2-api.onrender.com/api
      - key: VITE_MOBILE_APP_URL
        value: https://fleetnova2-conductor.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: fleetnova2-conductor
    runtime: static
    rootDir: mobile
    buildCommand: npm install -g npm@latest && npm cache clean --force && rm -rf node_modules package-lock.json && npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: VITE_API_URL
        value: https://fleetnova2-api.onrender.com/api
      - key: VITE_WEB_APP_URL
        value: https://fleetnova2-app.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
